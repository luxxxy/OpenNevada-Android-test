name: Build experimental Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "global.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.311"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download Godot 4.7.2 Mono and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*' -perm -u+x | head -n 1)"
          test -n "$GODOT_BIN"
          GODOT_ROOT="$(dirname "$GODOT_BIN")"
          test -d "$GODOT_ROOT/GodotSharp/Api/Debug"
          sudo mkdir -p /opt/godot-mono
          sudo cp -a "$GODOT_ROOT/." /opt/godot-mono/
          sudo ln -sf "/opt/godot-mono/$(basename "$GODOT_BIN")" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          test -d "$RUNNER_TEMP/templates/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/android_release.apk"
          godot --version

      - name: Configure Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Restore, import, and build Android C# assembly
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj -p:GodotTargetPlatform=android
          godot --headless --editor --path runtime --quit
          dotnet build runtime/OpenNV.csproj -p:GodotTargetPlatform=android --no-restore --configuration Debug
          DLL_PATH="$(find runtime/.godot/mono -type f -name OpenNV.dll -path '*/bin/Debug/*' | head -n 1)"
          test -n "$DLL_PATH"
          strings "$DLL_PATH" | grep -F 'falloutallfnvbsa'

      - name: Export ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          godot --headless --path runtime --export-debug "Android Handheld Experimental" "$GITHUB_WORKSPACE/output/OpenNevada-Experimental-ARM64.apk"
          test -s output/OpenNevada-Experimental-ARM64.apk
          file output/OpenNevada-Experimental-ARM64.apk
          unzip -p output/OpenNevada-Experimental-ARM64.apk assets/.godot/mono/publish/arm64/OpenNV.dll | strings | grep -F 'falloutallfnvbsa'
          sha256sum output/OpenNevada-Experimental-ARM64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNevada-Experimental-Android-ARM64
          path: output/OpenNevada-Experimental-ARM64.apk
          if-no-files-found: error
          retention-days: 14
