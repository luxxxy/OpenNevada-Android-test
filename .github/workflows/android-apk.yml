name: Build experimental Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/pc-feature-parity"]
    paths:
      - "runtime/**"
      - "global.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up PC-aligned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download Godot 4.8-dev7 Mono editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TEMPLATE_VERSION="4.8.dev7.mono"
          GODOT_TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$RUNNER_TEMP/godot" "$GODOT_TEMPLATE_DIR"
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.8-dev7/Godot_v4.8-dev7_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*' -perm -u+x | head -n 1)"
          test -n "$GODOT_BIN"
          GODOT_ROOT="$(dirname "$GODOT_BIN")"
          test -d "$GODOT_ROOT/GodotSharp/Api/Debug"
          sudo mkdir -p /opt/godot-mono
          sudo cp -a "$GODOT_ROOT/." /opt/godot-mono/
          sudo ln -sf "/opt/godot-mono/$(basename "$GODOT_BIN")" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.8-dev7/Godot_v4.8-dev7_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          test -d "$RUNNER_TEMP/templates/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$GODOT_TEMPLATE_DIR/"
          test -s "$GODOT_TEMPLATE_DIR/android_debug.apk"
          test -s "$GODOT_TEMPLATE_DIR/android_release.apk"
          godot --version

      - name: Configure Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Restore, import, and build Android C# assembly
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore runtime/OpenNV.csproj -p:GodotTargetPlatform=android
          godot --headless --editor --path runtime --quit
          dotnet build runtime/OpenNV.csproj -p:GodotTargetPlatform=android --no-restore --configuration Debug
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("runtime/.godot/mono").rglob("OpenNV.dll"))
          needle = b"falloutallfnvbsa"
          needle_utf16 = needle.decode("ascii").encode("utf-16le")
          matching = [p for p in candidates if needle in p.read_bytes() or needle_utf16 in p.read_bytes()]
          if not matching:
              raise SystemExit("ERROR: normalized archive-skip code is missing from every compiled OpenNV.dll")
          for path in matching:
              print(f"Verified compiled assembly: {path}")
          PY

      - name: Export and verify ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          godot --headless --path runtime --export-debug "Android Handheld Experimental" "$GITHUB_WORKSPACE/output/OpenNevada-Experimental-ARM64.apk"
          test -s output/OpenNevada-Experimental-ARM64.apk
          file output/OpenNevada-Experimental-ARM64.apk
          python3 - <<'PY'
          from zipfile import ZipFile

          apk = "output/OpenNevada-Experimental-ARM64.apk"
          needle = b"falloutallfnvbsa"
          needle_utf16 = needle.decode("ascii").encode("utf-16le")
          with ZipFile(apk) as archive:
              dlls = [name for name in archive.namelist() if name.endswith("/OpenNV.dll") or name == "OpenNV.dll"]
              if not dlls:
                  raise SystemExit("ERROR: OpenNV.dll was not found inside the exported APK")
              verified = []
              for name in dlls:
                  data = archive.read(name)
                  if needle in data or needle_utf16 in data:
                      verified.append(name)
              if not verified:
                  raise SystemExit("ERROR: exported APK does not contain the normalized archive-skip code")
              for name in verified:
                  print(f"Verified packaged assembly: {name}")
          PY
          sha256sum output/OpenNevada-Experimental-ARM64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNevada-Experimental-Android-ARM64
          path: output/OpenNevada-Experimental-ARM64.apk
          if-no-files-found: error
          retention-days: 14
